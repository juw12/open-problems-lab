name: Q5 inequality (finer split of case d5, top 4)

# Case d5 with d(e_0) = 4 is the slowest question of q5-inequality.yml.  Here it is cut into the ten
# sub-cases d(e_0), d(e_1), d(e_2) = 4, a, b with 4 >= a >= b >= 1, which together cover it.
# Each job writes one JSON file; q5_verdict.py reads the files of both workflows together.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "highs-d5-nbr411", solver: highs, flags: "nbr=4,1,1"}
          - {name: "highs-d5-nbr421", solver: highs, flags: "nbr=4,2,1"}
          - {name: "highs-d5-nbr422", solver: highs, flags: "nbr=4,2,2"}
          - {name: "highs-d5-nbr431", solver: highs, flags: "nbr=4,3,1"}
          - {name: "highs-d5-nbr432", solver: highs, flags: "nbr=4,3,2"}
          - {name: "highs-d5-nbr433", solver: highs, flags: "nbr=4,3,3"}
          - {name: "highs-d5-nbr441", solver: highs, flags: "nbr=4,4,1"}
          - {name: "highs-d5-nbr442", solver: highs, flags: "nbr=4,4,2"}
          - {name: "highs-d5-nbr443", solver: highs, flags: "nbr=4,4,3"}
          - {name: "highs-d5-nbr444", solver: highs, flags: "nbr=4,4,4"}
          - {name: "cpsat-d5-nbr411", solver: cpsat, flags: "nbr=4,1,1"}
          - {name: "cpsat-d5-nbr421", solver: cpsat, flags: "nbr=4,2,1"}
          - {name: "cpsat-d5-nbr422", solver: cpsat, flags: "nbr=4,2,2"}
          - {name: "cpsat-d5-nbr431", solver: cpsat, flags: "nbr=4,3,1"}
          - {name: "cpsat-d5-nbr432", solver: cpsat, flags: "nbr=4,3,2"}
          - {name: "cpsat-d5-nbr433", solver: cpsat, flags: "nbr=4,3,3"}
          - {name: "cpsat-d5-nbr441", solver: cpsat, flags: "nbr=4,4,1"}
          - {name: "cpsat-d5-nbr442", solver: cpsat, flags: "nbr=4,4,2"}
          - {name: "cpsat-d5-nbr443", solver: cpsat, flags: "nbr=4,4,3"}
          - {name: "cpsat-d5-nbr444", solver: cpsat, flags: "nbr=4,4,4"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ortools scipy numpy
      - name: Ask the solver
        working-directory: prize_work/flagship-erdos-86-f7/sources
        run: python q5_inequality_cases.py ${{ matrix.solver }} d5 19200 "${{ matrix.name }}.json" 4 ${{ matrix.flags }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.name }}
          path: prize_work/flagship-erdos-86-f7/sources/${{ matrix.name }}.json
          if-no-files-found: warn
